  align-items: center;
  justify-content: center;

.card {

.logo-ring {

.channel-label {

.check {

  line-height: 1.3;
  font-weight: 800;
  overflow-wrap: anywhere;
  margin-bottom: 7px;

.fire {
  font-size: 29px;
  margin-bottom: 18px;
}

.description {

  margin: 0 auto 25px;
  color: #a8b2c0;
  font-size: 16px;
  line-height: 1.7;
}

.join-btn {
  min-height: 59px;
  display: flex;
  align-items: center;

  gap: 11px;

  text-decoration: none;
  font-size: 18px;
  font-weight: 600;
  background: linear-gradient(100deg, #079fe8, #08c1f4);
  border-radius: 20px;
  box-shadow: 0 9px 25px rgba(0, 176, 255, 0.20);
}

.telegram-icon {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
}

.hint {
  color: #7d8999;
  font-size: 13px;
  line-height: 1.5;

.divider {
